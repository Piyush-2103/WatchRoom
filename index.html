<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watchroom</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<style>
:root{--bg:#0a0607;--vel:#7d1224;--vel2:#3a0610;--gold:#e9b44c;--gold2:#a77a1e;--cream:#f6ecd6;--mut:#b9a98c;--line:#e9b44c33;--bad:#ff7b7b}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{color:var(--cream);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% -10%,#3a1017,var(--bg) 62%) fixed}
body::before,body::after{content:"";position:fixed;top:0;bottom:0;width:72px;z-index:0;pointer-events:none;background:repeating-linear-gradient(90deg,var(--vel2) 0,var(--vel) 16px,var(--vel2) 32px);box-shadow:inset 0 0 40px #000}
body::before{left:0;border-right:2px solid var(--gold2)}body::after{right:0;border-left:2px solid var(--gold2)}
button,input,select{font:inherit;color:inherit}
button{background:#ffffff0a;border:1px solid var(--gold2);color:var(--gold);border-radius:8px;padding:8px 14px;cursor:pointer;transition:.15s}
button:hover:not(:disabled){background:#e9b44c22;box-shadow:0 0 14px #e9b44c44}button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:linear-gradient(#f6cf78,#d49a2b);border:0;color:#2a1604;font-weight:700}
button.off{color:var(--bad);border-color:var(--bad)}
input:not([type]),select{background:#0009;border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;color:var(--cream)}
select{width:auto}select option{color:#000}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.logo{font:400 46px/1 Impact,"Arial Narrow Bold",sans-serif;letter-spacing:6px;text-transform:uppercase;color:var(--gold);text-shadow:0 0 14px #e9b44c88,0 0 34px #e9b44c44}
.logo span{color:#fff6dd}.logo.sm{font-size:24px;letter-spacing:4px}
#land{min-height:100%;display:grid;place-items:center;padding:20px;position:relative;z-index:1}
.wrap{display:grid;gap:26px;justify-items:center;width:min(440px,100%)}
.card{width:100%;display:grid;gap:12px;padding:30px 28px;background:linear-gradient(#f6ecd6,#e6d5ab);color:#2a1604;border-radius:10px;box-shadow:0 20px 60px #000c;
 -webkit-mask:radial-gradient(circle 13px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 13px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 13px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 13px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat}
.card h2{margin:0;font:400 13px Impact,sans-serif;letter-spacing:6px;color:var(--vel)}
.card p{margin:0 0 6px;color:#5a4426}
.card input:not([type]){background:#fff9;color:#2a1604;border-color:#a77a1e88}
.card button:not(.pri){color:var(--vel);border-color:var(--vel)}
.or{display:flex;align-items:center;gap:10px;color:#7a6234;font-size:12px;letter-spacing:2px;text-transform:uppercase}.or:before,.or:after{content:"";flex:1;border-top:2px dashed #a77a1e88}
.row{display:flex;gap:8px}
#app{height:100%;display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto 1fr;margin:0 72px;position:relative;z-index:1}
header{grid-column:1/3;position:relative;display:flex;gap:10px;align-items:center;padding:14px 4px 24px}
header .logo{margin-right:auto}
header:after{content:"";position:absolute;left:0;right:0;bottom:6px;height:10px;background:radial-gradient(circle,#ffe08a 0 3px,transparent 4px) 0 0/24px 10px repeat-x;filter:drop-shadow(0 0 4px #ffcc55);animation:tw 2s steps(2) infinite}
@keyframes tw{50%{opacity:.5}}
.chip{font-size:13px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:3px 12px;background:#0006}
main{display:flex;flex-direction:column;min-height:0;padding:4px 14px 14px 4px;gap:12px;overflow:auto}
#bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}#bar input{flex:1;min-width:200px}
#rdy{color:var(--gold);font-size:13px}
#stage{flex:1;min-height:260px;background:#000;border-radius:6px;position:relative;overflow:hidden;border:4px solid #1b1315;box-shadow:0 0 0 2px var(--gold2),0 0 90px 12px #ffd98026,0 30px 80px #000}
#stage>div{position:absolute;inset:0}
#stage video,#stage iframe{width:100%;height:100%;border:0;background:#000}
#ph{color:var(--mut);text-align:center;display:grid;place-items:center;background:radial-gradient(ellipse at center,#2a1a12,#000 70%)}#ph .big{font-size:48px}
#rx{pointer-events:none;overflow:hidden;z-index:2}
.fl{position:absolute;bottom:20px;font-size:34px;animation:fl 2.8s ease-out forwards}
@keyframes fl{to{transform:translateY(-260px);opacity:0}}
#stage>#ctl{inset:0 0 auto 0;height:auto;display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(#000c,transparent);opacity:0;transition:opacity .2s;z-index:3}
#stage:hover #ctl,#ctl:focus-within{opacity:1}
#ctl button{padding:4px 10px;background:#0008}#ctl input{width:110px;accent-color:var(--gold)}
#dock{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
#reacts{display:flex;gap:6px}#reacts button{padding:4px 11px;font-size:18px}#reacts button:active{transform:scale(1.3)}
#tiles{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.tile{position:relative;flex:0 0 150px;aspect-ratio:16/10;background:var(--vel2);border-radius:12px 12px 4px 4px;overflow:hidden;border:2px solid #5a1c26}
.tile video{width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;left:6px;bottom:4px;font-size:12px;background:#000b;padding:1px 8px;border-radius:99px}
aside{background:linear-gradient(#1c0d10,#120709);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;margin:0 0 14px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:none;border-bottom:2px solid transparent;color:var(--mut);box-shadow:none!important}
.tabs button.on{border-bottom-color:var(--gold);color:var(--gold)}
.pane{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px;gap:10px;overflow:auto}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}
#log div{word-break:break-word}#log b{color:var(--gold);margin-right:6px}#log .sys{color:var(--mut);font-size:13px;font-style:italic}
#cf{display:flex;gap:8px}
#ulist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#ulist li{display:flex;gap:6px;align-items:center}#ulist li span{flex:1}#ulist li button{padding:3px 9px;font-size:13px}
.tag{font-size:12px;color:var(--gold);font-style:normal}
.opt{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.opt input{accent-color:var(--gold)}.opt small{color:var(--mut);display:block}
#snd{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:8;box-shadow:0 8px 30px #000a}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--cream);color:#2a1604;padding:10px 18px;border-radius:10px;font-weight:600;z-index:9;max-width:min(560px,92vw);box-shadow:0 8px 30px #000a}
body.theatre #app{grid-template-columns:1fr}body.theatre aside{display:none}
body.theatre header,body.theatre #dock,body.theatre #tiles,body.theatre #bar{opacity:.3;transition:opacity .3s}
body.theatre header:hover,body.theatre #dock:hover,body.theatre #tiles:hover,body.theatre #bar:hover{opacity:1}
@media(hover:none){#ctl{opacity:1!important}}
@media(max-width:800px){body::before,body::after{display:none}#app{grid-template-columns:1fr;grid-template-rows:auto auto 400px;height:auto;min-height:100%;margin:0 10px}header{grid-column:1;flex-wrap:wrap}main{overflow:visible;padding:4px 0}#stage{flex:none;aspect-ratio:16/9;min-height:0}.logo{font-size:36px}}
@media(prefers-reduced-motion:reduce){.fl,header:after{animation:none}*{transition:none!important}}
</style></head><body>

<div id="land"><div class="wrap">
 <div class="logo">Watch<span>room</span></div>
 <div class="card">
  <h2>ADMIT ONE</h2>
  <p>Movie night with friends. Free, private, peer-to-peer. No sign-up.</p>
  <input id="name" placeholder="Your name" maxlength="20" aria-label="Your name">
  <button id="create" class="pri">Open a screening room</button>
  <div class="or">or</div>
  <div class="row"><input id="code" placeholder="Room code" aria-label="Room code"><button id="join">Join</button></div>
 </div>
</div></div>

<div id="app" hidden>
 <header><div class="logo sm">Watch<span>room</span></div><span id="rc" class="chip"></span><span id="st" class="chip"></span><button id="theatre">Theatre mode</button><button id="copy">Copy invite link</button></header>
 <main>
  <div id="bar" hidden>
   <input id="yturl" placeholder="Paste a YouTube link" aria-label="YouTube link"><button id="loadyt">Play YouTube</button>
   <button id="pick" class="pri">Choose movie</button><input type="file" id="file" accept="video/*,audio/*,.mkv,.m4a,.mka" multiple hidden>
   <select id="q" aria-label="Stream quality"><option value="720">720p smooth</option><option value="1080">1080p</option><option value="480">480p</option></select><button id="fix" class="pri" hidden>Fix audio</button><span id="rdy"></span>
  </div>
  <div id="stage">
   <div id="ph"><div><div class="big">🎬</div>The screen is dark.<br>The host will start the show shortly.</div></div>
   <div id="ytp" hidden><div id="yt"></div></div>
   <div id="fvp" hidden><video id="fv" controls playsinline></video></div>
   <div id="gvp" hidden><video id="gv" playsinline></video></div>
   <div id="rx"></div>
   <div id="ctl" hidden><label id="volw">Volume <input type="range" id="vol" min="0" max="1" step="0.05" value="1"></label><button id="fs">Fullscreen</button></div>
  </div>
  <div id="dock">
   <button id="media">Join voice &amp; video</button><button id="mic" hidden>Mic</button><button id="cmt" hidden>Camera</button>
   <span class="sp"></span>
   <div id="reacts"><button>👍</button><button>😂</button><button>😮</button><button>❤️</button><button>👏</button><button>🔥</button></div>
  </div>
  <div id="tiles"></div>
  <audio id="fa" preload="auto"></audio>
 </main>
 <aside>
  <div class="tabs"><button data-tab="chat" id="tabchat" class="on">Chat</button><button data-tab="ppl">Audience</button><button data-tab="adm" id="tabadm" hidden>Host</button></div>
  <div class="pane" id="chat"><div id="log"></div><form id="cf" autocomplete="off"><input id="msg" placeholder="Say something…" maxlength="500" aria-label="Message"><button class="pri">Send</button></form></div>
  <div class="pane" id="ppl" hidden><ul id="ulist"></ul></div>
  <div class="pane" id="adm" hidden>
   <label class="opt"><input type="checkbox" id="s-chat"><div>Chat<small>Let guests send messages</small></div></label>
   <label class="opt"><input type="checkbox" id="s-mic"><div>Guest microphones<small>Off mutes everyone but you</small></div></label>
   <label class="opt"><input type="checkbox" id="s-cam"><div>Guest cameras<small>Off turns guest video off</small></div></label>
   <label class="opt"><input type="checkbox" id="s-control"><div>Guests control YouTube<small>Play, pause and seek for everyone</small></div></label>
   <label class="opt"><input type="checkbox" id="s-react"><div>Reactions<small>Let guests send emoji reactions</small></div></label>
   <label class="opt"><input type="checkbox" id="s-locked"><div>Lock room<small>Block new people from joining</small></div></label>
  </div>
 </aside>
</div>
<button id="snd" class="pri" hidden>Tap to enable sound</button>
<div id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s),sh=(e,v)=>e.hidden=!v;
let peer,isHost=false,me={},hostConn,conns={},users={},calls={},local=null,movieStream=null,mode='none',yt=null,ytOK=false,ytId=null,applying=false,invite='';
let S={chat:true,mic:true,cam:true,control:false,locked:false,react:true},unread=0;
const ready=new Set(),BR={1080:6e6,720:3.5e6,480:1.5e6};
const ICE={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turns:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}]}};
const send=(c,m)=>c&&c.open&&c.send(m);
const bcast=(m,x)=>Object.values(conns).forEach(c=>c.peer!==x&&send(c,m));
function toast(t,ms=3500){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,ms)}

/* ---------- connect ---------- */
function start(host){
  $('#create').disabled=$('#join').disabled=true;
  const name=$('#name').value.trim()||'Guest'+(Math.random()*99|0),code=$('#code').value.trim();
  if(!host&&!code)return toast('Enter a room code');
  isHost=host;
  peer=host?new Peer('wr'+Math.random().toString(36).slice(2,8),ICE):new Peer(undefined,ICE);
  peer.on('open',id=>{
    me={id,name};users[id]={name,host};
    const room=host?id:code;invite=location.href.split('#')[0]+'#'+room;
    $('#land').hidden=true;$('#app').hidden=false;$('#rc').textContent='Room '+room;
    if(host){sh($('#volw'),false);sh($('#bar'),true);sh($('#tabadm'),true);applySettings()}
    else{
      hostConn=peer.connect(room,{reliable:true});
      hostConn.on('open',()=>{send(hostConn,{t:'hello',name});renderUsers()});
      hostConn.on('data',guestRecv);
      hostConn.on('close',()=>{renderUsers();toast('Disconnected from the host')});
    }
  });
  peer.on('connection',c=>isHost&&hostAccept(c));
  peer.on('call',onCall);
  peer.on('error',e=>{$('#create').disabled=$('#join').disabled=false;toast(e.type==='peer-unavailable'?'Room not found. Check the code.':'Connection error: '+e.type);if(e.type==='peer-unavailable')setTimeout(()=>location.reload(),2200)});
}
function hostAccept(c){
  c.on('data',d=>{
    if(d.t==='hello'){
      if(S.locked){send(c,{t:'denied'});return setTimeout(()=>c.close(),400)}
      conns[c.peer]=c;users[c.peer]={name:String(d.name).slice(0,20)};
      send(c,{t:'init',users,S,mode,ytId});
      bcast({t:'users',users});renderUsers();sys(users[c.peer].name+' joined');syncCalls();
      if(movieStream)callMovie(c.peer);
    }else if(conns[c.peer]){
      if(d.t==='chat'&&S.chat){const m={t:'chat',from:users[c.peer].name,text:String(d.text).slice(0,500)};bcast(m,c.peer);addChat(m)}
      if(d.t==='yt'&&S.control){applyYT(d);bcast(d,c.peer)}
      if(d.t==='react'&&S.react){bcast(d,c.peer);float(d.e)}
      if(d.t==='ready'){ready.add(c.peer);updReady()}
    }
  });
  c.on('close',()=>{
    if(!conns[c.peer])return;
    sys(users[c.peer].name+' left');delete conns[c.peer];delete users[c.peer];
    bcast({t:'users',users});renderUsers();dropPeer(c.peer);
  });
}
function guestRecv(d){
  if(d.t==='init'){users=d.users;S=d.S;renderUsers();applySettings();setMode(d.mode,d.ytId)}
  else if(d.t==='users'){users=d.users;renderUsers();syncCalls();document.querySelectorAll('.tile').forEach(t=>{if(!users[t.dataset.id])dropPeer(t.dataset.id)})}
  else if(d.t==='settings'){S=d.S;applySettings()}
  else if(d.t==='mode')setMode(d.mode,d.id)
  else if(d.t==='chat')addChat(d)
  else if(d.t==='yt')applyYT(d)
  else if(d.t==='react')float(d.e)
  else if(d.t==='kick'){toast('The host removed you from the room');setTimeout(()=>location.reload(),1500)}
  else if(d.t==='mute'){setTrack('audio',false);toast('The host muted you')}
  else if(d.t==='denied')toast('This room is locked')
}

/* ---------- chat & people ---------- */
function addChat(m){
  const d=document.createElement('div'),l=$('#log');
  if(m.sys){d.className='sys';d.textContent=m.text}else{const b=document.createElement('b');b.textContent=m.from;d.append(b,document.createTextNode(m.text))}
  l.append(d);l.scrollTop=l.scrollHeight;
  if($('#chat').hidden&&!m.sys){unread++;$('#tabchat').textContent='Chat ('+unread+')'}
}
const sys=text=>addChat({sys:true,text});
function sendChat(){
  const i=$('#msg'),t=i.value.trim();if(!t)return;
  if(isHost){const m={t:'chat',from:me.name,text:t};bcast(m);addChat(m)}
  else{
    if(!hostConn||!hostConn.open)return toast('Not connected to the host yet. Wait a moment and try again.');
    if(!S.chat)return toast('The host turned chat off');addChat({from:me.name,text:t});send(hostConn,{t:'chat',text:t});
  }
  i.value='';
}
function renderUsers(){
  const ul=$('#ulist');ul.innerHTML='';updReady();
  $('#st').textContent=isHost?'● '+Object.keys(conns).length+' watching':(hostConn&&hostConn.open?'● Connected':'● Connecting…');
  for(const id in users){
    const li=document.createElement('li'),s=document.createElement('span');
    s.textContent=users[id].name+(id===me.id?' (you)':'');li.append(s);
    if(users[id].host){const g=document.createElement('em');g.className='tag';g.textContent='host';li.append(g)}
    else if(isHost){
      for(const [a,l] of [['mute','Mute'],['kick','Remove']]){const b=document.createElement('button');b.textContent=l;b.dataset.a=a;b.dataset.id=id;li.append(b)}
    }
    ul.append(li);
  }
}
$('#ulist').onclick=e=>{
  const b=e.target.closest('button');if(!b||!isHost)return;const c=conns[b.dataset.id];
  if(b.dataset.a==='mute')send(c,{t:'mute'});
  else{send(c,{t:'kick'});setTimeout(()=>c&&c.close(),300)}
};

/* ---------- admin settings ---------- */
function applySettings(){
  document.querySelectorAll('#reacts button').forEach(b=>b.disabled=!isHost&&!S.react);$('#msg').readOnly=!S.chat&&!isHost;$('#msg').placeholder=S.chat||isHost?'Say something…':'Chat is turned off by the host';
  if(!isHost){
    if(!S.mic)setTrack('audio',false);if(!S.cam)setTrack('video',false);
    $('#mic').disabled=!S.mic;$('#cmt').disabled=!S.cam;
  }
  for(const k in S){const e=$('#s-'+k);if(e)e.checked=S[k]}
}
['chat','mic','cam','control','react','locked'].forEach(k=>$('#s-'+k).onchange=e=>{S[k]=e.target.checked;bcast({t:'settings',S});applySettings()});

/* ---------- cam & mic (mesh) ---------- */
function setTrack(kind,on){if(local)(kind==='audio'?local.getAudioTracks():local.getVideoTracks()).forEach(t=>t.enabled=on)}
$('#media').onclick=async()=>{
  try{
    const gum=o=>navigator.mediaDevices.getUserMedia(o),A={echoCancellation:true,noiseSuppression:true,autoGainControl:true};
    try{local=await gum({video:{width:{ideal:640},height:{ideal:360},frameRate:{ideal:24}},audio:A})}
    catch{local=await gum({audio:A});toast('No camera available. Joined with mic only.')}
    addTile(me.id,local,true);sh($('#media'),false);sh($('#mic'),true);sh($('#cmt'),true);applySettings();syncCalls();
  }catch{toast('Allow camera and microphone access to join the call')}
};
function toggle(btn,kind){
  const t=(kind==='audio'?local.getAudioTracks():local.getVideoTracks())[0];if(!t)return;
  t.enabled=!t.enabled;btn.classList.toggle('off',!t.enabled);btn.textContent=(kind==='audio'?'Mic':'Camera')+(t.enabled?'':' off');
}
$('#mic').onclick=e=>toggle(e.target,'audio');$('#cmt').onclick=e=>toggle(e.target,'video');
function callCam(id){
  const c=peer.call(id,local,{metadata:{type:'cam'}});calls['cam:'+id]=c;
  c.on('stream',s=>addTile(id,s));c.on('close',()=>delete calls['cam:'+id]);setTimeout(()=>capCam(c),1000);
}
function syncCalls(){if(local)for(const id in users)if(id!==me.id&&!calls['cam:'+id])callCam(id)}
function onCall(call){
  const t=call.metadata&&call.metadata.type;
  if(t==='movie'){
    call.answer();
    call.on('stream',s=>{const g=$('#gv');g.srcObject=s;g.muted=false;g.play().catch(()=>{g.muted=true;g.play();sh($('#snd'),true)});smooth(call);send(hostConn,{t:'ready'})});
  }else{
    call.answer(local||undefined);if(local)setTimeout(()=>capCam(call),1000);
    call.on('stream',s=>addTile(call.peer,s));call.on('close',()=>dropTile(call.peer));
  }
}
function addTile(id,s,self){
  let t=document.querySelector('.tile[data-id="'+id+'"]');
  if(!t){
    t=document.createElement('div');t.className='tile';t.dataset.id=id;
    const v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.muted=!!self;v.dataset.self=self?1:0;
    const l=document.createElement('span');l.textContent=self?'You':(users[id]?users[id].name:'Guest');
    t.append(v,l);$('#tiles').append(t);
  }
  const v=t.querySelector('video');v.srcObject=s;v.play().catch(()=>sh($('#snd'),true));
}
function dropTile(id){const t=document.querySelector('.tile[data-id="'+id+'"]');t&&t.remove()}
function dropPeer(id){dropTile(id);['cam:','movie:'].forEach(p=>{if(calls[p+id]){calls[p+id].close();delete calls[p+id]}})}

/* ---------- what's playing ---------- */
function setMode(m,id){
  mode=m;sh($('#ctl'),m==='file');sh($('#ph'),m==='none');sh($('#ytp'),m==='yt');sh($('#fvp'),m==='file'&&isHost);sh($('#gvp'),m==='file'&&!isHost);
  if(m!=='yt'&&ytOK)yt.pauseVideo();
  if(m!=='file'&&!isHost)$('#gv').srcObject=null;
  if(m==='yt')loadYT(id);
}
function hostMode(m,id){ytId=id||null;setMode(m,id);bcast({t:'mode',mode:m,id})}

/* YouTube */
function ytReady(cb){
  if(window.YT&&YT.Player)return cb();
  const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.append(s);
  window.onYouTubeIframeAPIReady=cb;
}
function loadYT(id){
  ytId=id;
  ytReady(()=>{
    if(yt){if(ytOK)yt.loadVideoById(id);return}
    yt=new YT.Player('yt',{playerVars:{rel:0,playsinline:1},events:{
      onReady:()=>{ytOK=true;yt.loadVideoById(ytId);yt.setPlaybackQuality('hd1080')},
      onStateChange:e=>{
        if(applying||!(isHost||S.control))return;
        if(e.data===1||e.data===2){
          const m={t:'yt',a:e.data===1?'play':'pause',time:yt.getCurrentTime()};
          isHost?bcast(m):send(hostConn,m);
        }
      }}});
  });
}
function applyYT(m){
  if(!ytOK)return;applying=true;
  if(Math.abs(yt.getCurrentTime()-m.time)>2.5)yt.seekTo(m.time,true);
  const st=yt.getPlayerState(),pause=m.a==='pause'||(m.a==='sync'&&!m.playing);
  if(m.a==='sync'&&st===3)return applying=false;
  if(pause){if(st===1)yt.pauseVideo()}else if(st!==1)yt.playVideo();
  setTimeout(()=>applying=false,1000);
}
setInterval(()=>{if(isHost&&mode==='yt'&&ytOK)bcast({t:'yt',a:'sync',time:yt.getCurrentTime(),playing:yt.getPlayerState()===1})},4000);
$('#loadyt').onclick=()=>{
  const r=$('#yturl').value.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
  if(!r)return toast('That is not a valid YouTube link');
  stopMovie();hostMode('yt',r[1]);
};

/* Local file -> everyone (host's browser re-streams it over WebRTC) */
$('#pick').onclick=()=>$('#file').click();
let lastFile=null,sc=null;
const isAud=f=>/^audio\//.test(f.type)||/\.(m4a|aac|mka|opus|mp3|ogg|wav|flac)$/i.test(f.name);
$('#file').onchange=e=>loadFiles([...e.target.files]);
function sideStream(a){ /* plays the separate audio file here AND feeds it into the stream guests receive */
  if(!sc){const ac=new (window.AudioContext||window.webkitAudioContext)(),src=ac.createMediaElementSource(a),dst=ac.createMediaStreamDestination(),g=ac.createGain();src.connect(dst);src.connect(g);g.connect(ac.destination);sc={ac,dst,g}}
  sc.ac.resume();return sc.dst.stream;
}
function syncAudio(v,a){
  const go=()=>{a.currentTime=v.currentTime;a.play().catch(()=>{})};
  v.onplay=v.onplaying=go;v.onpause=v.onwaiting=()=>a.pause();v.onseeked=()=>{a.currentTime=v.currentTime};v.onratechange=()=>{a.playbackRate=v.playbackRate};
  syncAudio.t=setInterval(()=>{if(!v.paused&&Math.abs(a.currentTime-v.currentTime)>.25)a.currentTime=v.currentTime},1000);
}
async function loadFiles(list){
  const aud=list.find(isAud),f=list.find(x=>!isAud(x));
  if(!f)return toast('Choose the movie file. You can also pick a saved fixed-audio file together with it.');
  lastFile=f;sh($('#fix'),false);stopMovie();
  const v=$('#fv'),a=$('#fa');v.src=URL.createObjectURL(f);v.muted=!!aud;hostMode('file');sh($('#volw'),!!aud);
  let side=null;if(aud){a.src=URL.createObjectURL(aud);side=sideStream(a);syncAudio(v,a)}
  try{await v.play()}catch{}
  const cap=v.captureStream||v.mozCaptureStream;
  if(!cap)return toast('Use Chrome, Edge or Firefox to stream files');
  const vs=cap.call(v);movieStream=aud?new MediaStream([...vs.getVideoTracks(),...side.getAudioTracks()]):vs;
  ready.clear();Object.keys(conns).forEach(callMovie);updReady();
  await new Promise(r=>setTimeout(r,1800));
  const bad=!aud&&(!movieStream.getAudioTracks().length||v.webkitAudioDecodedByteCount===0||v.mozHasAudio===false);
  v.pause();v.currentTime=0;
  toast(bad?'No sound: your browser can\'t decode this movie\'s audio (AC3/DTS). Press "Fix audio". It extracts only the audio, not the whole movie, and asks where to save it.':'Ready. Press play once everyone shows as ready.',bad?15000:4000);
  sh($('#fix'),bad);
}
function callMovie(id){
  if(!movieStream)return;
  const c=peer.call(id,movieStream,{metadata:{type:'movie'}});calls['movie:'+id]=c;
  [800,3000].forEach(ms=>setTimeout(()=>boost(c),ms));
}
function boost(c){ /* cap bitrate by chosen quality; balanced mode drops frames gracefully instead of stalling */
  const q=+$('#q').value,h=$('#fv').videoHeight||q;
  try{c.peerConnection.getSenders().forEach(s=>{
    if(!s.track||s.track.kind!=='video')return;
    s.track.contentHint='motion';
    const p=s.getParameters();p.encodings=p.encodings&&p.encodings.length?p.encodings:[{}];
    p.encodings[0].maxBitrate=BR[q];p.encodings[0].scaleResolutionDownBy=Math.max(1,h/q);p.encodings[0].maxFramerate=30;
    p.degradationPreference='balanced';p.encodings[0].priority='high';p.encodings[0].networkPriority='high';s.setParameters(p).catch(()=>{});
  })}catch{}
}
function stopMovie(){
  Object.keys(calls).filter(k=>k.startsWith('movie:')).forEach(k=>{calls[k].close();delete calls[k]});
  movieStream=null;ready.clear();updReady();clearInterval(syncAudio.t);$('#fa').pause();const v=$('#fv');v.onplay=v.onplaying=v.onpause=v.onwaiting=v.onseeked=v.onratechange=null;v.pause();v.removeAttribute('src');v.load();
}

/* ---------- ready gate, reactions, playback smoothing ---------- */
function updReady(){const r=$('#rdy');if(r)r.textContent=isHost&&movieStream?'Ready: '+ready.size+'/'+Object.keys(conns).length:''}
function float(e){
  const d=document.createElement('div');d.className='fl';d.textContent=e;
  d.style.left=(8+Math.random()*80)+'%';$('#rx').append(d);setTimeout(()=>d.remove(),3000);
}
document.querySelectorAll('#reacts button').forEach(b=>b.onclick=()=>{
  const e=b.textContent;float(e);isHost?bcast({t:'react',e}):send(hostConn,{t:'react',e});
});
/* guests buffer ~1.5s: movies don't need low latency, and this hides network jitter */
function smooth(c){[500,2500].forEach(ms=>setTimeout(()=>{try{c.peerConnection.getReceivers().forEach(r=>{
  if('jitterBufferTarget' in r)r.jitterBufferTarget=1500;if('playoutDelayHint' in r)r.playoutDelayHint=1.5})}catch{}},ms))}
/* webcams stay light so they never compete with the movie for bandwidth */
function capCam(c){try{c.peerConnection.getSenders().forEach(s=>{if(s.track&&s.track.kind==='video'){
  const p=s.getParameters();p.encodings=p.encodings&&p.encodings.length?p.encodings:[{}];p.encodings[0].maxBitrate=4e5;s.setParameters(p).catch(()=>{})}})}catch{}}
$('#q').onchange=()=>Object.keys(calls).filter(k=>k.startsWith('movie:')).forEach(k=>boost(calls[k]));
$('#fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():$('#stage').requestFullscreen();
$('#vol').oninput=e=>{const x=+e.target.value;$('#gv').volume=x;$('#gv').muted=false;if(sc)sc.g.gain.value=x};
$('#gv').onclick=()=>{$('#gv').muted=false};

$('#snd').onclick=()=>{document.querySelectorAll('.tile video,#gv').forEach(v=>{v.muted=v.dataset.self==='1';v.play().catch(()=>{})});sh($('#snd'),false)};

/* In-browser audio fix: copy the video untouched, re-encode only the audio to AAC (ffmpeg.wasm, runs locally) */
async function fixAudio(){
  const f=lastFile;if(!f)return;
  const name=f.name.replace(/\.\w+$/,'')+' (fixed audio).m4a',r=$('#rdy'),b=$('#fix');
  let h=null; /* choose the save location first (needs a fresh click); the result goes straight to disk, not browser memory */
  if(window.showSaveFilePicker){try{h=await showSaveFilePicker({suggestedName:name,types:[{description:'AAC audio',accept:{'audio/mp4':['.m4a']}}]})}catch(e){if(e.name==='AbortError')return}}
  b.disabled=true;
  try{
    r.textContent='Loading converter (one-time, ~30 MB)…';
    const ff=new FFmpegWASM.FFmpeg(),{toBlobURL}=FFmpegUtil;
    ff.on('progress',({progress})=>r.textContent='Extracting audio… '+Math.max(0,Math.min(99,Math.round(progress*100)))+'% (a 3 GB movie takes several minutes)');
    const C='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/',W='https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/';
    await ff.load({classWorkerURL:await toBlobURL(W+'814.ffmpeg.js','text/javascript'),coreURL:await toBlobURL(C+'ffmpeg-core.js','text/javascript'),wasmURL:await toBlobURL(C+'ffmpeg-core.wasm','application/wasm')});
    const src=new File([f],'input.'+(f.name.split('.').pop()||'mkv'));
    await ff.mount('WORKERFS',{files:[src]},'/in'); /* streams the movie from disk, never loads all 3 GB */
    const code=await ff.exec(['-i','/in/'+src.name,'-map','0:a:0','-vn','-c:a','aac','-b:a','160k','-ac','2','out.m4a']);
    if(code)throw new Error('this file has no convertible audio track (exit '+code+')');
    const data=await ff.readFile('out.m4a');ff.terminate();
    let out=new File([data],name,{type:'audio/mp4'});
    if(h){const w=await h.createWritable();await w.write(data);await w.close();out=await h.getFile()}
    else{const x=document.createElement('a');x.href=URL.createObjectURL(out);x.download=name;x.click()}
    r.textContent='';toast('Audio saved to your computer. Next time choose the movie and this .m4a together to skip conversion.',9000);
    await loadFiles([f,out]);
  }catch(e){r.textContent='';toast('Conversion failed: '+(e.message||e),9000)}
  b.disabled=false;
}
$('#fix').onclick=fixAudio;
